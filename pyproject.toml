[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bank-csv-cleaner"
version = "0.1.0"
description = "CLI to clean bank CSV files, categorize transactions, and summarize monthly spending"
requires-python = ">=3.9"

[project.scripts]
bank-cleaner = "bank_cleaner.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"
