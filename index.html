<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Fruit Catcher</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at top, #203050, #0c1220 65%);
      color: #fff;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 8px;
    }
    .wrap { width: min(100vw - 16px, 520px); }
    .hud { display:flex; justify-content:space-between; margin-bottom:8px; font-weight:700; }
    canvas {
      width: 100%;
      height: auto;
      border-radius: 16px;
      border: 2px solid rgba(255,255,255,.2);
      touch-action: none;
      background: linear-gradient(#2b4f8b, #133560);
      box-shadow: 0 10px 30px rgba(0,0,0,.35);
    }
    .controls { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-top:10px; }
    button {
      border:0; border-radius:14px; padding:14px 10px; font-size:18px; font-weight:800;
      background:#ffd24d; color:#222;
    }
    #restart { background:#7dff9d; }
    .hint { text-align:center; opacity:.9; margin-top:8px; font-size:13px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hud">
      <div>Score: <span id="score">0</span></div>
      <div>Lives: <span id="lives">3</span></div>
      <div>Best: <span id="best">0</span></div>
    </div>
    <canvas id="game" width="480" height="700" aria-label="Fruit Catcher Game"></canvas>
    <div class="controls">
      <button id="left">⬅️</button>
      <button id="restart">🔄 Restart</button>
      <button id="right">➡️</button>
    </div>
    <div class="hint">Drag the basket or use arrows. Catch 🍎, avoid 💣.</div>
  </div>
  <script src="game.js"></script>
</body>
</html>
